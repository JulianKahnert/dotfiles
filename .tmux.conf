set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Previously set by ShellFish's tmux integration, which is now switched off.
set -g mouse on              # swipe-scroll in ShellFish
set -g set-clipboard on      # apps inside tmux may copy via OSC 52
set -as terminal-features '*:sync'

set -g renumber-windows on   # keine Lücken nach dem Schließen
set -g default-terminal "tmux-256color"
set -sg escape-time 10       # sonst hakt ESC in vim

set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Statusleiste: Windows als deutliche Tabs, aktives invertiert, unterstrichen = neue Ausgabe
set -g status-style 'bg=green,fg=black'
set -g window-status-separator ''
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-style 'bg=green,fg=black'
set -g window-status-current-style 'bg=black,fg=green,bold'
set -g window-status-activity-style 'bg=green,fg=black,underscore'
set -g monitor-activity on
# Kein Session-Name, Host und Uhr: der ganze Platz gehört den Windows (iPhone ~60 Spalten)
set -g status-left ''
set -g status-right ''
